name: Sync opportunities

on:
  schedule:
    - cron: "0 */10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run sync
        run: python scripts/sync_and_export.py
      - name: Commit updated data
        run: |
          git config user.name "sip-oih-bot"
          git config user.email "actions@github.com"
          git add data/opportunities.json
          git diff --quiet --cached || git commit -m "Auto-sync opportunities $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
